name: Status artifact security

on:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Inspect the currently served static artifact
        if: github.repository == 'dev-null-GmbH/d0-status'
        run: |
          mkdir -p "$RUNNER_TEMP/status-evidence" "$RUNNER_TEMP/observed"
          url=https://status.d0.eu
          curl -fsS --max-time 15 "$url/status.json" -o "$RUNNER_TEMP/observed/status.json"
          for name in index.html status.css status.js; do
            curl -fsS --max-time 15 "$url/$name" -o "$RUNNER_TEMP/observed/$name"
          done
          curl -fsS --max-time 15 "$url/status.json" -o "$RUNNER_TEMP/observations-end.json"
          cmp "$RUNNER_TEMP/observations-end.json" "$RUNNER_TEMP/observed/status.json"
          bun tools/verify-static-artifact.ts "$RUNNER_TEMP/observed" observed > "$RUNNER_TEMP/status-evidence/observed.json"
      - name: Audit locked browser-test dependencies
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/status-evidence"
          bun install --frozen-lockfile --ignore-scripts
          revision=$(git rev-parse HEAD)
          lock=$(sha256sum bun.lock | cut -d' ' -f1)
          jq -n --arg revision "$revision" --arg lock "$lock" --arg time "$(date -u +%FT%TZ)" \
            '{revision: $revision, lockSha256: $lock, scanner: "Bun 1.4.5 audit", advisorySource: "npm", queriedAt: $time, role: "browser-test toolchain"}' \
            > "$RUNNER_TEMP/status-evidence/audit-scope.json"
          bun audit --json > "$RUNNER_TEMP/status-evidence/bun-audit.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: status-security-${{ github.run_id }}
          path: ${{ runner.temp }}/status-evidence/
          retention-days: 30
          if-no-files-found: error
