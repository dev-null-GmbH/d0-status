name: Independent public status

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-status-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publication routing
        run: bash tools/test-metadata-only.sh
      - name: Determine whether this run updates Pages
        id: scope
        env:
          PUSH_BASE: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          publish=false
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            publish=true
            if [[ "$GITHUB_EVENT_NAME" == push && "$PUSH_FORCED" == false ]] &&
               bash tools/metadata-only.sh "$PUSH_BASE" "$GITHUB_SHA"; then
              publish=false
            fi
          fi
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Verify contracts and safe rendering
        run: bun test
      - name: Build offline review fixture
        run: bun run build.ts --fixture
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - name: Observe public endpoints
        if: steps.scope.outputs.publish == 'true'
        run: bun run build.ts
      - name: Verify and record the exact static output
        env:
          PUBLISH: ${{ steps.scope.outputs.publish }}
        run: |
          role=fixture
          if [[ "$PUBLISH" == true ]]; then role=publication; fi
          bun tools/verify-static-artifact.ts dist "$role" "$GITHUB_SHA" > "$RUNNER_TEMP/static-artifact.json"
          cat "$RUNNER_TEMP/static-artifact.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-artifact-${{ github.sha }}
          path: ${{ runner.temp }}/static-artifact.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.scope.outputs.publish == 'true'
        with:
          path: dist
          retention-days: 1
  publish:
    if: >-
      github.repository == 'dev-null-GmbH/d0-status' &&
      github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
